<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxkio Simulador IA Executive</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      color: #38bdf8;
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .scenarios {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      color: #e2e8f0;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    button {
      margin-top: 18px;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #7dd3fc;
    }

    .result {
      margin-top: 30px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 20px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .metric {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
    }

    .metric span {
      display: block;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .metric strong {
      font-size: 24px;
      color: #38bdf8;
    }

.progress-bar {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
    }

    .green {
      background: linear-gradient(90deg, #22c55e, #4ade80);
    }

    .yellow {
      background: linear-gradient(90deg, #eab308, #facc15);
    }

    .red {
      background: linear-gradient(90deg, #ef4444, #f87171);
    }

    .blue {
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .agent-card {
      background: linear-gradient(180deg, #0f172a, #020617);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .agent-card h3 {
      color: #38bdf8;
      margin-top: 0;
    }

    .agent-card p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .agent-card ul {
      padding-left: 18px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .error {
      color: #f87171;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>OXKIO SIMULADOR IA EXECUTIVE</h1>

    <p class="subtitle">
      ComitÃƒÂ© ejecutivo multiagente para simulaciÃƒÂ³n estratÃƒÂ©gica empresarial.
    </p>

    <div class="scenarios" id="scenariosBox">
      Cargando escenarios disponibles...
    </div>

    <textarea id="promptInput" placeholder="Ejemplo: quiero crear un SaaS B2B para CEOs"></textarea>

    <button onclick="runSimulation()">
  Simular con ComitÃƒÂ© IA
</button>

<button onclick="generateExecutiveReport()">
  Generar Informe Ejecutivo
</button>

<button onclick="exportExecutivePDF()">
  Exportar PDF Ejecutivo
</button>

<button onclick="showExecutiveMemory()">
  Ver Memoria Executive
</button>

<div class="result">
  <h2>Comparador Ejecutivo</h2>

  <textarea
    id="compareInputA"
    placeholder="Proyecto A: ejemplo, crear un SaaS IA para CEOs">
  </textarea>

  <textarea
    id="compareInputB"
    placeholder="Proyecto B: ejemplo, crear una consultorÃƒÂ­a IA para CEOs">
  </textarea>

  <button onclick="compareProjects()">
    Comparar Proyectos
  </button>

  <button onclick="exportComparisonPDF()">
    Exportar PDF Comparativo
  </button>
</div>


    <div class="result" id="resultBox">
      <h2>Resultado ejecutivo</h2>
      <p>AquÃƒÂ­ aparecerÃƒÂ¡ la simulaciÃƒÂ³n y el anÃƒÂ¡lisis multiagente.</p>
    </div>

  </div>

  <script>
    fetch("http://localhost:3100/scenarios")
      .then(response => response.json())
      .then(scenarios => {
        document.getElementById("scenariosBox").innerHTML =
          "<b>Escenarios disponibles:</b> " + scenarios.join(", ");
      });

function getScoreClass(score) {

  if (score >= 80) {
    return "green";
  }

  if (score >= 60) {
    return "yellow";
  }

  return "red";
}

function renderExecutiveSummary(text) {
  const opportunity =
    text.match(/OPORTUNIDAD:\s*([\s\S]*?)(RIESGO:|RECOMENDACION:|$)/i);

  const risk =
    text.match(/RIESGO:\s*([\s\S]*?)(RECOMENDACION:|$)/i);

  const recommendation =
    text.match(/RECOMENDACION:\s*([\s\S]*)/i);

  return `
    <div class="agents-grid">
      <div class="agent-card">
        <h3>Oportunidad</h3>
        <p>${opportunity ? opportunity[1].trim() : "-"}</p>
      </div>

      <div class="agent-card">
        <h3>Riesgo principal</h3>
        <p>${risk ? risk[1].trim() : "-"}</p>
      </div>

      <div class="agent-card">
        <h3>RecomendaciÃƒÂ³n CEO</h3>
        <p>${recommendation ? recommendation[1].trim() : "-"}</p>
      </div>
    </div>
  `;
}


    function renderAgentItems(agent) {
      const items =
        agent.recommendations ||
        agent.alerts ||
        agent.strategies ||
        [];

      if (!items.length) {
        return "<p>Sin observaciones especÃƒÂ­ficas.</p>";
      }

      return "<ul>" + items.map(item => `<li>${item}</li>`).join("") + "</ul>";
    }

    function runSimulation() {
      const input = document.getElementById("promptInput").value;
      const resultBox = document.getElementById("resultBox");

      resultBox.innerHTML = "<p>Simulando comitÃƒÂ© ejecutivo IA...</p>";

      fetch(`http://localhost:3100/simulate?prompt=${encodeURIComponent(input)}`)
        .then(response => response.json())
        .then(result => {

          if (result.error) {
            resultBox.innerHTML = `
              <h2 class="error">No se ha detectado escenario</h2>
              <p>Prueba con: consulting, restaurant o saas.</p>
            `;
            return;
          }

          const agents =
            result.agentAnalysis && result.agentAnalysis.agents
              ? result.agentAnalysis.agents
              : [];

const ceoAgent =
  agents.find(agent => agent.agent === "CEO Agent");

const ceoSummary =
  ceoAgent &&
  ceoAgent.recommendations &&
  ceoAgent.recommendations[0]
    ? ceoAgent.recommendations[0]
    : "Sin resumen ejecutivo disponible.";

          const agentCards = agents.map(agent => `
            <div class="agent-card">
              <h3>${agent.agent}</h3>
              <p><b>Foco:</b> ${agent.focus}</p>
              ${renderAgentItems(agent)}
            </div>
          `).join("");

          resultBox.innerHTML = `
            <h2>Resultado ejecutivo</h2>

${renderExecutiveSummary(ceoSummary)}

<p><b>Proyecto detectado:</b> ${result.project}</p>

            <div class="metrics">
              <div class="metric">
                <span>InversiÃƒÂ³n estimada</span>
                <strong>${result.estimatedInvestment || "-"}</strong>
              </div>

              <div class="metric">
  <span>Viabilidad</span>

  <strong>${result.viabilityScore}/100</strong>

  <div class="progress-bar">
    <div
      class="progress-fill ${getScoreClass(result.viabilityScore)}"
      style="width:${result.viabilityScore}%">
    </div>
  </div>
</div>

              <div class="metric">
  <span>Riesgo</span>

  <strong>${result.riskScore}/100</strong>

  <div class="progress-bar">
    <div
      class="progress-fill red"
      style="width:${result.riskScore}%">
    </div>
  </div>
</div>

              <div class="metric">
  <span>Escalabilidad</span>

  <strong>${result.scalabilityScore}/100</strong>

  <div class="progress-bar">
    <div
      class="progress-fill blue"
      style="width:${result.scalabilityScore}%">
    </div>
  </div>
</div>
            </div>

            <div class="metrics">
              <div class="metric">
                <span>Dificultad</span>
                <strong>${result.difficulty}</strong>
              </div>

              <div class="metric">
                <span>Tiempo estimado</span>
                <strong>${result.estimatedTime || "-"}</strong>
              </div>
            </div>

            <h2>ComitÃƒÂ© IA Executive</h2>

            <div class="agents-grid">
              ${agentCards}
            </div>
          `;
        });
    }
async function generateExecutiveReport() {

  const prompt =
    document.getElementById("promptInput").value;

  const resultBox =
    document.getElementById("resultBox");

  resultBox.innerHTML =
    "<h2>Generando informe ejecutivo...</h2>";

  try {

    const response =
      await fetch(
        `http://localhost:3100/simulate?prompt=${encodeURIComponent(prompt)}`
      );

    const data =
      await response.json();

    const ceoAgent =
      data.agentAnalysis.agents.find(
        a => a.agent === "CEO Agent"
      );

    resultBox.innerHTML = `

      <h2>INFORME EJECUTIVO</h2>

      <h3>Proyecto</h3>
      <p>${data.project}</p>

      <h3>Resumen EstratÃƒÂ©gico</h3>
      <p>
        ${ceoAgent.recommendations[0]}
      </p>

      <h3>Indicadores</h3>

      <ul>
        <li>Viabilidad: ${data.viabilityScore}/100</li>
        <li>Riesgo: ${data.riskScore}/100</li>
        <li>Escalabilidad: ${data.scalabilityScore}/100</li>
      </ul>

      <h3>RecomendaciÃƒÂ³n</h3>

      <p>
        Revisar el anÃƒÂ¡lisis del CEO Agent y validar
        comercialmente antes de ejecutar inversiones.
      </p>

    `;

  } catch (error) {

    resultBox.innerHTML =
      "<h2>Error generando informe.</h2>";

  }

}

function exportExecutivePDF() {
  const prompt =
    document.getElementById("promptInput").value;

  const url =
    `http://localhost:3100/report-pdf?prompt=${encodeURIComponent(prompt)}`;

  window.open(url, "_blank");
}

function exportComparisonPDF() {
  const inputA =
    document.getElementById("compareInputA").value;

  const inputB =
    document.getElementById("compareInputB").value;

  const url =
    `http://localhost:3100/report-comparison-pdf?a=${encodeURIComponent(inputA)}&b=${encodeURIComponent(inputB)}`;

  window.open(url, "_blank");
}

async function showExecutiveMemory() {
  const resultBox =
    document.getElementById("resultBox");

  resultBox.innerHTML =
    "<h2>Cargando memoria ejecutiva...</h2>";

  const response =
    await fetch("http://localhost:3100/memory");

  const memory =
    await response.json();

  const goals =
    memory.goals || [];

  const decisions =
    memory.decisions || [];

  const priorities =
    memory.priorities || [];

  const projects =
    memory.projects || [];

  function renderItems(items) {
    if (!items.length) {
      return "<p>No hay registros guardados.</p>";
    }

    return `
      <ul>
        ${items
          .map(item => `<li>${item.text}</li>`)
          .join("")}
      </ul>
    `;
  }

  resultBox.innerHTML = `
    <h2>Executive Memory</h2>

    <div class="agents-grid">
      <div class="agent-card">
        <h3>Objetivos</h3>
        <p>${goals.length} registrados</p>
      </div>

      <div class="agent-card">
        <h3>Decisiones</h3>
        <p>${decisions.length} registradas</p>
      </div>

      <div class="agent-card">
        <h3>Prioridades</h3>
        <p>${priorities.length} registradas</p>
      </div>

      <div class="agent-card">
        <h3>Proyectos</h3>
        <p>${projects.length} registrados</p>
      </div>
    </div>

    <h2>AÃ±adir memoria ejecutiva</h2>

    <select id="memoryType">
      <option value="goals">Objetivo</option>
      <option value="decisions">DecisiÃ³n</option>
      <option value="priorities">Prioridad</option>
      <option value="projects">Proyecto</option>
    </select>

    <textarea
      id="memoryText"
      placeholder="Escribe aquÃ­ el objetivo, decisiÃ³n, prioridad o proyecto que Oxkio debe recordar">
    </textarea>

    <button onclick="saveExecutiveMemoryItem()">
      Guardar en memoria
    </button>

    <h2>Objetivos guardados</h2>
    ${renderItems(goals)}

    <h2>Decisiones guardadas</h2>
    ${renderItems(decisions)}

    <h2>Prioridades guardadas</h2>
    ${renderItems(priorities)}

    <h2>Proyectos guardados</h2>
    ${renderItems(projects)}
  `;
}

async function saveExecutiveMemoryItem() {
  const type =
    document.getElementById("memoryType").value;

  const text =
    document.getElementById("memoryText").value.trim();

  if (!text) {
    alert("Escribe algo antes de guardar en memoria.");
    return;
  }

  await fetch(
    `http://localhost:3100/remember?type=${encodeURIComponent(type)}&text=${encodeURIComponent(text)}`
  );

  await showExecutiveMemory();
}
async function saveAdvisorDecisionToMemory() {
  const advisorBlock =
    document.querySelector(".agent-card pre");

  if (!advisorBlock) {
    alert("No hay decisión del Advisor para guardar.");
    return;
  }

  const decisionText =
    advisorBlock.innerText.trim();

  if (!decisionText) {
    alert("La decisión del Advisor está vacía.");
    return;
  }

  await fetch(
    `http://localhost:3100/remember?type=decisions&text=${encodeURIComponent(decisionText)}`
  );

  alert("Decisión guardada en Executive Memory.");
}
async function compareProjects() {
  const inputA =
    document.getElementById("compareInputA").value;

  const inputB =
    document.getElementById("compareInputB").value;

  const resultBox =
    document.getElementById("resultBox");

  resultBox.innerHTML =
    "<h2>Comparando proyectos...</h2>";

  const responseA =
    await fetch(
      `http://localhost:3100/simulate?prompt=${encodeURIComponent(inputA)}`
    );

  const responseB =
    await fetch(
      `http://localhost:3100/simulate?prompt=${encodeURIComponent(inputB)}`
    );

  const projectA =
    await responseA.json();

  const projectB =
    await responseB.json();

  const viabilityWinner =
    projectA.viabilityScore > projectB.viabilityScore
      ? "Proyecto A"
      : "Proyecto B";

  const riskWinner =
    projectA.riskScore < projectB.riskScore
      ? "Proyecto A"
      : "Proyecto B";

  const scalabilityWinner =
    projectA.scalabilityScore > projectB.scalabilityScore
      ? "Proyecto A"
      : "Proyecto B";

  let winsA = 0;
  let winsB = 0;

  if (viabilityWinner === "Proyecto A") winsA++;
  else winsB++;

  if (riskWinner === "Proyecto A") winsA++;
  else winsB++;

  if (scalabilityWinner === "Proyecto A") winsA++;
  else winsB++;

  const globalWinner =
    winsA > winsB
      ? "Proyecto A"
      : "Proyecto B";

  const decisionResponse =
    await fetch(
      `http://localhost:3100/decision?a=${encodeURIComponent(inputA)}&b=${encodeURIComponent(inputB)}`
    );

  const decisionData =
    await decisionResponse.json();

  resultBox.innerHTML = `
    <h2>Comparador Ejecutivo</h2>

    <div class="agents-grid">

      <div class="agent-card">
        <h3>Proyecto A</h3>
        <p><b>Tipo:</b> ${projectA.project}</p>
        <p><b>Viabilidad:</b> ${projectA.viabilityScore}/100</p>
        <p><b>Riesgo:</b> ${projectA.riskScore}/100</p>
        <p><b>Escalabilidad:</b> ${projectA.scalabilityScore}/100</p>
      </div>

      <div class="agent-card">
        <h3>Proyecto B</h3>
        <p><b>Tipo:</b> ${projectB.project}</p>
        <p><b>Viabilidad:</b> ${projectB.viabilityScore}/100</p>
        <p><b>Riesgo:</b> ${projectB.riskScore}/100</p>
        <p><b>Escalabilidad:</b> ${projectB.scalabilityScore}/100</p>
      </div>

    </div>

    <h2>Ranking Ejecutivo</h2>

    <div class="agents-grid">

      <div class="agent-card">
        <h3>PuntuaciÃƒÂ³n Proyecto A</h3>
        <p>
          ${
            projectA.viabilityScore +
            projectA.scalabilityScore -
            projectA.riskScore
          }
          puntos
        </p>
      </div>

      <div class="agent-card">
        <h3>PuntuaciÃƒÂ³n Proyecto B</h3>
        <p>
          ${
            projectB.viabilityScore +
            projectB.scalabilityScore -
            projectB.riskScore
          }
          puntos
        </p>
      </div>

    </div>

    <h2>Ganadores por categorÃƒÂ­a</h2>

    <div class="agents-grid">

      <div class="agent-card">
        <h3>Viabilidad</h3>
        <p>${viabilityWinner}</p>
      </div>

      <div class="agent-card">
        <h3>Menor riesgo</h3>
        <p>${riskWinner}</p>
      </div>

      <div class="agent-card">
        <h3>Escalabilidad</h3>
        <p>${scalabilityWinner}</p>
      </div>

    </div>

    <h2>Executive Advisor GPT</h2>

    <div class="agent-card">
      <pre style="white-space: pre-wrap; font-family: Arial, sans-serif;">
${decisionData.decision}
      </pre>

      <button onclick="saveAdvisorDecisionToMemory()">
        Guardar decisión en memoria
      </button>
    </div>

    <h2>DecisiÃƒÂ³n Ejecutiva</h2>

    <div class="agent-card">

      <h3>Proyecto recomendado</h3>

      <p>
        <b>${globalWinner}</b>
      </p>

      <p>
        ${globalWinner} gana ${globalWinner === "Proyecto A" ? winsA : winsB}
        de 3 categorÃƒÂ­as estratÃƒÂ©gicas principales.
      </p>

      <p>
        Esta recomendaciÃƒÂ³n se basa en viabilidad, riesgo y escalabilidad.
      </p>
    </div>
  `;
}

  </script>

</body>
</html>
