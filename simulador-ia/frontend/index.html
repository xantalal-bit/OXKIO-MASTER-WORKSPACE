<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxkio Simulador IA Executive</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      color: #38bdf8;
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .scenarios {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      color: #e2e8f0;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    button {
      margin-top: 18px;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #7dd3fc;
    }

    .result {
      margin-top: 30px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 20px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .metric {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
    }

    .metric span {
      display: block;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .metric strong {
      font-size: 24px;
      color: #38bdf8;
    }

.progress-bar {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
    }

    .green {
      background: linear-gradient(90deg, #22c55e, #4ade80);
    }

    .yellow {
      background: linear-gradient(90deg, #eab308, #facc15);
    }

    .red {
      background: linear-gradient(90deg, #ef4444, #f87171);
    }

    .blue {
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .agent-card {
      background: linear-gradient(180deg, #0f172a, #020617);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .agent-card h3 {
      color: #38bdf8;
      margin-top: 0;
    }

    .agent-card p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .agent-card ul {
      padding-left: 18px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .error {
      color: #f87171;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>OXKIO SIMULADOR IA EXECUTIVE</h1>

    <p class="subtitle">
      Comité ejecutivo multiagente para simulación estratégica empresarial.
    </p>

    <div class="scenarios" id="scenariosBox">
      Cargando escenarios disponibles...
    </div>

    <textarea id="promptInput" placeholder="Ejemplo: quiero crear un SaaS B2B para CEOs"></textarea>

    <button onclick="runSimulation()">
  Simular con Comité IA
</button>

<button onclick="generateExecutiveReport()">
  Generar Informe Ejecutivo
</button>

<button onclick="exportExecutivePDF()">
  Exportar PDF Ejecutivo
</button>

    <div class="result" id="resultBox">
      <h2>Resultado ejecutivo</h2>
      <p>Aquí aparecerá la simulación y el análisis multiagente.</p>
    </div>

  </div>

  <script>
    fetch("http://localhost:3100/scenarios")
      .then(response => response.json())
      .then(scenarios => {
        document.getElementById("scenariosBox").innerHTML =
          "<b>Escenarios disponibles:</b> " + scenarios.join(", ");
      });

function getScoreClass(score) {

  if (score >= 80) {
    return "green";
  }

  if (score >= 60) {
    return "yellow";
  }

  return "red";
}

    function renderAgentItems(agent) {
      const items =
        agent.recommendations ||
        agent.alerts ||
        agent.strategies ||
        [];

      if (!items.length) {
        return "<p>Sin observaciones específicas.</p>";
      }

      return "<ul>" + items.map(item => `<li>${item}</li>`).join("") + "</ul>";
    }

    function runSimulation() {
      const input = document.getElementById("promptInput").value;
      const resultBox = document.getElementById("resultBox");

      resultBox.innerHTML = "<p>Simulando comité ejecutivo IA...</p>";

      fetch(`http://localhost:3100/simulate?prompt=${encodeURIComponent(input)}`)
        .then(response => response.json())
        .then(result => {

          if (result.error) {
            resultBox.innerHTML = `
              <h2 class="error">No se ha detectado escenario</h2>
              <p>Prueba con: consulting, restaurant o saas.</p>
            `;
            return;
          }

          const agents =
            result.agentAnalysis && result.agentAnalysis.agents
              ? result.agentAnalysis.agents
              : [];

          const agentCards = agents.map(agent => `
            <div class="agent-card">
              <h3>${agent.agent}</h3>
              <p><b>Foco:</b> ${agent.focus}</p>
              ${renderAgentItems(agent)}
            </div>
          `).join("");

          resultBox.innerHTML = `
            <h2>Resultado ejecutivo</h2>

            <p><b>Proyecto detectado:</b> ${result.project}</p>

            <div class="metrics">
              <div class="metric">
                <span>Inversión estimada</span>
                <strong>${result.estimatedInvestment || "-"}</strong>
              </div>

              <div class="metric">
  <span>Viabilidad</span>

  <strong>${result.viabilityScore}/100</strong>

  <div class="progress-bar">
    <div
      class="progress-fill ${getScoreClass(result.viabilityScore)}"
      style="width:${result.viabilityScore}%">
    </div>
  </div>
</div>

              <div class="metric">
  <span>Riesgo</span>

  <strong>${result.riskScore}/100</strong>

  <div class="progress-bar">
    <div
      class="progress-fill red"
      style="width:${result.riskScore}%">
    </div>
  </div>
</div>

              <div class="metric">
  <span>Escalabilidad</span>

  <strong>${result.scalabilityScore}/100</strong>

  <div class="progress-bar">
    <div
      class="progress-fill blue"
      style="width:${result.scalabilityScore}%">
    </div>
  </div>
</div>
            </div>

            <div class="metrics">
              <div class="metric">
                <span>Dificultad</span>
                <strong>${result.difficulty}</strong>
              </div>

              <div class="metric">
                <span>Tiempo estimado</span>
                <strong>${result.estimatedTime || "-"}</strong>
              </div>
            </div>

            <h2>Comité IA Executive</h2>

            <div class="agents-grid">
              ${agentCards}
            </div>
          `;
        });
    }
async function generateExecutiveReport() {

  const prompt =
    document.getElementById("promptInput").value;

  const resultBox =
    document.getElementById("resultBox");

  resultBox.innerHTML =
    "<h2>Generando informe ejecutivo...</h2>";

  try {

    const response =
      await fetch(
        `http://localhost:3100/simulate?prompt=${encodeURIComponent(prompt)}`
      );

    const data =
      await response.json();

    const ceoAgent =
      data.agentAnalysis.agents.find(
        a => a.agent === "CEO Agent"
      );

    resultBox.innerHTML = `

      <h2>INFORME EJECUTIVO</h2>

      <h3>Proyecto</h3>
      <p>${data.project}</p>

      <h3>Resumen Estratégico</h3>
      <p>
        ${ceoAgent.recommendations[0]}
      </p>

      <h3>Indicadores</h3>

      <ul>
        <li>Viabilidad: ${data.viabilityScore}/100</li>
        <li>Riesgo: ${data.riskScore}/100</li>
        <li>Escalabilidad: ${data.scalabilityScore}/100</li>
      </ul>

      <h3>Recomendación</h3>

      <p>
        Revisar el análisis del CEO Agent y validar
        comercialmente antes de ejecutar inversiones.
      </p>

    `;

  } catch (error) {

    resultBox.innerHTML =
      "<h2>Error generando informe.</h2>";

  }

}

function exportExecutivePDF() {
  const prompt =
    document.getElementById("promptInput").value;

  const url =
    `http://localhost:3100/report-pdf?prompt=${encodeURIComponent(prompt)}`;

  window.open(url, "_blank");
}

  </script>

</body>
</html>
